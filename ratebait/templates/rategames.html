<!-- import base.html -->
{% extends "base.html" %}


<!-- Nieuwe titel -->
{% block title %} RateBait - Rate Games {% endblock %}


<!-- Content block -->
{% block content %}
<!-- Searchbar -->
<div class="search-section">
    <h1 class="mb-4">Search Games</h1>
    <form method="POST" class="d-flex justify-content-center gap-2">
        <input type="text" name="search_query" class="search-input" placeholder="Search for a game..." value="{{ query if query }}">
        <button type="submit" class="btn-search">Search</button>
    </form>
</div>


<!-- Zoekresultaten in grid tegels -->
<div class="game-grid">
    {% for game in games %}
    <a href="/game/{{ game.id }}">
        <div class="game-card">
            <img src="{{ game.cover_url }}" alt="{{ game.name }} Cover">
            <h3>{{ game.name }}</h3>
        </div>
    </a>
    {% endfor %}
</div>


<!-- Geen games gevonden alternatief -->
{% if query and not games %}
<div class="text-center w-100 mt-5">
    <p class="text-muted">No games found for "{{ query }}". Try another search!</p>
</div>
{% endif %}

{% endblock %}
