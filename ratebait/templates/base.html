<!doctype html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RateBait{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo/favicon.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    {% include "components/navbar.html" %}

    <style>
    /* Letterboxd-stijl aanpassingen */
    body { background: #14181c; color: white; }
    
    .game-grid { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
        gap: 25px; 
        padding-top: 20px; 
    }
    
    .game-card { 
        background: #2c3440; 
        padding: 10px; 
        border-radius: 8px; 
        text-align: center; 
        transition: transform 0.2s, border 0.2s;
        border: 2px solid transparent;
        height: 100%;
    }
    
    .game-card:hover { 
        transform: scale(1.05); 
        border: 2px solid #ff601c; 
    }
    
    .game-card img { 
        width: 100%; 
        border-radius: 4px; 
        margin-bottom: 10px;
    }
    
    .game-card h3 { 
        font-size: 1.1rem; 
        margin: 0;
        color: #fff;
    }

    .search-section {
        text-align: center;
        margin-bottom: 40px;
    }

    .search-input { 
        padding: 10px; 
        width: 100%; 
        max-width: 400px; 
        border-radius: 4px; 
        border: 1px solid #444;
        background: #1a2129;
        color: white;
    }

    .btn-search { 
        padding: 10px 20px; 
        background: #ff601c; 
        border: none; 
        border-radius: 4px; 
        color: white; 
        font-weight: bold;
    }
    
    .btn-search:hover {
        background: #B55304;
    }

    ::placeholder {
    color: #ccc;
    opacity: 1;
    }

    input.form-control,
    input[type="text"],
    input[type="password"],
    input[type="email"] {
        background-color: #1a2129;
        color: white;
        border: 1px solid #444;
    }

    input.form-control:focus,
    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="email"]:focus {
        border-color: #B55304;
        box-shadow: 0 0 0 0.2rem #B55304;
        outline: none;
    }

    /*Flash messages */
    .alert {
        border-radius: 6px;
        border: 1px solid #ff601c;
        background-color: #1a2129;
        color: white;
        padding: 12px 16px;
    }

    /* Close button */
    .alert .btn-close {
        filter: invert(100%);
    }

    
    a { text-decoration: none; }
    </style>
    <main class="container py-4">
        {% block content %} {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
