<!doctype html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RateBait{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo/favicon.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='stijl.css') }}">
</head>


<body>
        <!-- Navbar checken op admin status -->
    {% if current_user.is_authenticated and current_user.is_admin %}
        {% include "components/admin_navbar.html" %}
    {% else %}
        <!-- Navbar toevoegen aan de base template -->
    {% include "components/navbar.html" %}
    {% endif %}

    
    <!-- Main content in een container-->
    <main class="container py-4">
        {% for message in get_flashed_messages() %}
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        {% block content %} {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
